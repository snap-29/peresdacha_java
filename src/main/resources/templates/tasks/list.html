<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout :: head('Задачи')}"></head><body><nav th:replace="~{layout :: navbar}"></nav><main><h1>Задачи</h1>
<a class="button" th:href="@{/web/tasks/new}">+ Создать задачу</a><p th:if="${#lists.isEmpty(tasks)}">Пока нет задач. Создайте первую.</p>
<table th:unless="${#lists.isEmpty(tasks)}"><thead><tr><th>Название</th><th>Приоритет</th><th>Статус</th><th>Действия</th></tr></thead><tbody>
<tr th:each="task : ${tasks}"><td><a th:href="@{/web/tasks/{id}(id=${task.id})}" th:text="${task.title}"></a></td><td th:text="${task.priority}"></td><td th:text="${task.status}"></td><td class="actions">
<a sec:authorize="hasAnyRole('USER','ADMIN')" th:href="@{/web/tasks/{id}/edit(id=${task.id})}">Редактировать</a>
<form sec:authorize="hasRole('ADMIN')" th:action="@{/web/tasks/{id}/delete(id=${task.id})}" method="post"><button class="danger">Удалить</button></form></td></tr></tbody></table>
<div class="actions"><a th:if="${page.hasPrevious()}" th:href="@{/web/tasks(page=${page.number - 1})}">Назад</a><span th:text="|Страница ${page.number + 1}, всего задач: ${page.totalElements}|"></span><a th:if="${page.hasNext()}" th:href="@{/web/tasks(page=${page.number + 1})}">Далее</a></div>
</main></body></html>
